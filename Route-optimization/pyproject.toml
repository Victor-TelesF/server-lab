[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Route-optimization"
version = "0.1.0"
dependencies = [
    "numpy",
    "matplotlib",
    "ipympl",
    "jupyter",
    "ipykernel",
    "pytest",
]

[tool.setuptools.packages.find]
include = ["domain*"]